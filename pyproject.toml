[project]
name = "driver-wattcycle"
version = "0.1.0"
description = "Just for WattCycle: BLE driver for WattCycle JBD BMS batteries, publishing battery telemetry over MQTT."
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["driver_wattcycle*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
