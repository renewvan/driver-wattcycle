; driver-wattcycle — WattCycle driver configuration
; ====================================================
; This file ships with the package and contains every available setting
; with a safe default. DO NOT EDIT — create a config.ini instead and
; override only what you need. config.ini is gitignored and local to
; each install.

[mqtt]
host = localhost
port = 1883
; username =
; password =
client_id = driver-wattcycle
reconnect_min_delay = 1.0
reconnect_max_delay = 30.0

[driver]
id = wattcycle
; name — optional human label for this battery bank, published retained on
; renewvan/battery/<id>/name (e.g. name = House bank). Leave empty to publish none.
name =
update_interval_ms = 3000
; mac — BLE address of the battery BMS (required at runtime), e.g.:
; mac = XX:XX:XX:XX:XX:XX
mac =
; uuid_variant — "auto" detects jbd (ff01/ff02) vs dh04 (fff1/fff2);
; force with "jbd" or "dh04" if auto-detection misbehaves.
uuid_variant = auto
hci_adapter = hci0
connect_timeout_s = 10
retry_delay_s = 5
